<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Formulário</title>
   <link rel="icon" type="image/png" href="b.png" />
   <link rel="stylesheet" href="styles.css" />
</head>
<body>
   <div class="app">
      <main id="main" class="main" aria-live="polite">
         <header class="top-bar">
            <a href="index.html" class="btn-icon" aria-label="Página inicial">🏠</a>
            <h1>Cadastro de Usuário</h1>
            <nav class="top-nav">
               <a href="login.html" class="btn-icon btn-auth">Login</a>
            </nav>
         </header>
         <section class="panel">
            <form id="registerForm">
                  <script>
                  document.getElementById('registerForm').addEventListener('submit', async function(e) {
                     e.preventDefault();
                     const name = document.getElementById('name').value.trim();
                     const email = prompt('Digite seu email para cadastro:').trim();
                     const password = prompt('Digite uma senha:');
                     if (!name || !email || !password) return alert('Preencha todos os campos.');
                     try {
                        const res = await fetch('/register', {
                           method: 'POST',
                           headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify({ name, email, password })
                        });
                        if (!res.ok) {
                           const data = await res.json();
                           alert(data.error || 'Erro ao registrar.');
                           return;
                        }
                        // Salva email e senha no localStorage para facilitar o login
                        localStorage.setItem('lastRegister', JSON.stringify({ email, password }));
                        alert('Cadastro realizado! Faça login.');
                        window.location.href = 'login.html';
                     } catch (err) {
                        alert('Erro ao conectar ao servidor.');
                     }
                  });
                  </script>
        <div class="field">
           <label for="name">Nome</label>
           <input type="text" id="name" name="name" required />
        </div>
        <div class="field">
           <label for="idade">Idade</label>
           <input type="number" id="idade" name="idade" min="0" max="200" required />
        </div>
        <div class="field">
           <label for="cidade">Cidade</label>
           <input type="text" id="cidade" name="cidade" required />
        </div>
        <div class="field">
           <label for="uf">UF</label>
           <input type="text" id="uf" name="uf" maxlength="2" required />
        </div>
        <div class="field">
           <label for="endereco">Endereço</label>
           <input type="text" id="endereco" name="endereco" required />
        </div>
        <div class="field">
           <label for="bairro">Bairro</label>
           <input type="text" id="bairro" name="bairro" required />
        </div>
        <div class="field">
           <label for="numero">Número da Casa (AP)</label>
           <input type="number" id="numero" name="numero" required />
        </div>
        <div class="field">
           <label for="email">Email</label>
           <input type="email" id="email" name="email" required />
        </div>
        <div class="field">
           <label for="senha">Senha</label>
           <input type="password" id="senha" name="senha" required />
        </div>
        <div class="field">
           <label for="telefone">Telefone</label>
           <input type="tel" id="telefone" name="telefone" required placeholder="(XX)XXXXX-XXXX" />
        </div>
      <fieldset class="custom-fieldset field">
         <legend>Sexo</legend>
         <div class="radio-group">
            <label class="radio-label"><input type="radio" name="sexo" value="Masculino" required>Masculino</label>
            <label class="radio-label"><input type="radio" name="sexo" value="Feminino">Feminino</label>
            <label class="radio-label"><input type="radio" name="sexo" value="naomencionar">Não Mencionar</label>
         </div>
      </fieldset>
            <button type="submit" class="action-btn">Registrar</button>
            </form>
         </section>
      </main>
   </div>
</body>
</html>
