<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>
    <link rel="icon" type="image/png" href="b.png" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main id="main" class="main" aria-live="polite">
      <header class="top-bar">
        <a href="index.html" class="btn-icon" aria-label="Página inicial">🏠</a>
        <h1>Perfil do Usuário</h1>
        <nav class="top-nav">
          <button id="logoutBtn" class="btn-icon btn-auth">Sair</button>
        </nav>
      </header>
      <section class="panel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 340px;">
        <div id="profileInfo" style="text-align: center;">
          <div style="margin-bottom: 20px;">
            <img id="userPhoto" src="https://via.placeholder.com/80x80?text=Foto" alt="Foto do usuário" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;" />
          </div>
          <div id="userName" style="font-size: 1.2rem; font-weight: bold;">Nome do Usuário</div>
          <div id="userEmail" style="color: #666; margin-bottom: 20px;">email@exemplo.com</div>
          <form id="photoForm" enctype="multipart/form-data">
            <label for="photoInput" style="cursor: pointer; color: #1e90ff;">Alterar foto</label>
            <input type="file" id="photoInput" name="photo" accept="image/*" style="display: none;" />
            <button type="submit" class="action-btn" style="margin-top: 10px;">Salvar foto</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
  <script src="profile.js"></script>
</body>
</html>
